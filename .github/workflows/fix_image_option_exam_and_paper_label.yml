name: Fix image option exams and paper label

on:
  push:
    paths:
      - 'scripts/fix_image_option_exam_and_paper_label.py'
      - '.github/workflows/fix_image_option_exam_and_paper_label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/fix_image_option_exam_and_paper_label.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Support image-option exam questions and show paper name"
          git push
