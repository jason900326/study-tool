name: Add Auth MVP
on:
  push:
    paths:
      - 'scripts/add_auth_mvp.py'
      - '.github/workflows/add_auth_mvp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply auth patch
        run: python scripts/add_auth_mvp.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Auth anchors check
        run: |
          grep -q 'def auth_page' streamlit_app.py
          grep -q 'def _auth_client' streamlit_app.py
          grep -q 'user_id' streamlit_app.py
          grep -q 'if not _auth_user()' streamlit_app.py
          grep -q 'reset_password_email' streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add minimal Supabase Auth and user isolation"
          git push
