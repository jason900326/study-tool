name: Place slime nickname inline

on:
  push:
    paths:
      - 'scripts/place_slime_name_inline.py'
      - '.github/workflows/place_slime_name_inline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply inline nickname patch
        run: python scripts/place_slime_name_inline.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Place slime nickname edit inline"
          git push
