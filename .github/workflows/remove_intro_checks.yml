name: Remove MedSlime intro checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove_intro_checks.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove redundant intro checklist
        run: python scripts/remove_intro_checks.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit updated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No app changes to commit."
            exit 0
          fi
          git commit -m "Simplify material intro"
          git push
