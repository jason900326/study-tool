name: Gacha test MVP v2
on:
  push:
    paths:
      - 'scripts/gacha_test_mvp_v2.py'
      - '.github/workflows/gacha_test_mvp_v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/gacha_test_mvp_v2.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix companion home and add gacha 10-pull test mode"
          git push
