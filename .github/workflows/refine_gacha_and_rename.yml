name: Refine gacha and slime rename
on:
  push:
    paths:
      - 'scripts/refine_gacha_and_rename.py'
      - '.github/workflows/refine_gacha_and_rename.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/refine_gacha_and_rename.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Refine gacha rewards text colors and slime rename"
          git push
