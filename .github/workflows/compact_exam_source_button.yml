name: Compact exam source button

on:
  push:
    paths:
      - 'scripts/compact_exam_source_button.py'
      - '.github/workflows/compact_exam_source_button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact source button patch
        run: python scripts/compact_exam_source_button.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Compact official source button"
          git push
