name: Use all slime artwork

on:
  push:
    paths:
      - 'scripts/use_all_slime_art.py'
      - '.github/workflows/use_all_slime_art.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply slime artwork patch
        run: python scripts/use_all_slime_art.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Use uploaded slime artwork"
          git push
