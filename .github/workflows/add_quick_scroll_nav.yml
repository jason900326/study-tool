name: Add quick scroll navigation

on:
  push:
    paths:
      - 'scripts/add_quick_scroll_nav.py'
      - '.github/workflows/add_quick_scroll_nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/add_quick_scroll_nav.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add quick scroll top and bottom controls"
          git push
