name: Add internal PDF viewer

on:
  push:
    paths:
      - 'scripts/add_internal_pdf_viewer.py'
      - '.github/workflows/add_internal_pdf_viewer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/add_internal_pdf_viewer.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py requirements.txt
          git diff --cached --quiet && exit 0
          git commit -m "Render located PDF pages inside MedSlime"
          git push
