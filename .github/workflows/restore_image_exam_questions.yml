name: Restore image exam questions

on:
  push:
    paths:
      - 'scripts/restore_image_exam_questions.py'
      - '.github/workflows/restore_image_exam_questions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply image-question restore patch
        run: python scripts/restore_image_exam_questions.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Restore image questions in national exam"
          git push
