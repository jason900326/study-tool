name: Finish MedSlime back buttons

on:
  push:
    paths:
      - 'scripts/finish_back_buttons.py'
      - '.github/workflows/finish_back_buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/finish_back_buttons.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit updated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add consistent quiz back buttons"
          git push
