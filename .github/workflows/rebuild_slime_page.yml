name: Rebuild slime page
on:
  push:
    paths:
      - 'scripts/rebuild_slime_page.py'
      - 'scripts/fix_rebuild_slime_page.py'
      - '.github/workflows/rebuild_slime_page.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix patch script
        run: python scripts/fix_rebuild_slime_page.py
      - name: Apply patch
        run: python scripts/rebuild_slime_page.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild slime collection for 17-slime roster"
          git push
