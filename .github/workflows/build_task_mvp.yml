name: Build task MVP
on:
  push:
    paths:
      - 'scripts/build_task_mvp.py'
      - '.github/workflows/build_task_mvp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply task MVP patch
        run: python scripts/build_task_mvp.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Task anchors check
        run: |
          grep -q 'def tasks_page' streamlit_app.py
          grep -q 'player_task_events' streamlit_app.py
          grep -q '_task_record_quiz_once' streamlit_app.py
          grep -q 'elif page == "tasks"' streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Build daily weekly task MVP"
          git push
