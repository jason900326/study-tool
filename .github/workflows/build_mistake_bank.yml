name: Build MedSlime mistake bank

on:
  push:
    paths:
      - 'scripts/build_mistake_bank.py'
      - 'scripts/trigger_mistake_bank.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mistake bank patch
        run: python scripts/build_mistake_bank.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Build folder-based mistake review bank"
          git push
