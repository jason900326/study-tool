name: Left align mistake folders

on:
  push:
    paths:
      - 'scripts/left_align_mistake_folders.py'
      - '.github/workflows/left_align_mistake_folders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alignment patch
        run: python scripts/left_align_mistake_folders.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Left align mistake folder rows"
          git push
