name: Use official answer key for all exam rows

on:
  push:
    paths:
      - 'scripts/use_official_answer_key_for_all_exam_rows.py'
      - '.github/workflows/use_official_answer_key_for_all_exam_rows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/use_official_answer_key_for_all_exam_rows.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Use official answer sheets as canonical exam answers"
          git push
