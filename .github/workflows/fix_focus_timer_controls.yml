name: Fix focus timer controls

on:
  push:
    paths:
      - 'scripts/fix_focus_timer_controls.py'
      - '.github/workflows/fix_focus_timer_controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focus timer fixes
        run: python scripts/fix_focus_timer_controls.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix focus stop dialog and break progress"
          git push
