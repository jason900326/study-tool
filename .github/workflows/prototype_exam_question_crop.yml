name: Prototype exam question crop

on:
  push:
    paths:
      - 'scripts/prototype_exam_question_crop.py'
      - '.github/workflows/prototype_exam_question_crop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply crop prototype
        run: python scripts/prototype_exam_question_crop.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Prototype official question crop viewer"
          git push
