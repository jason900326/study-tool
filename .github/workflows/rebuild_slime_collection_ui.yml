name: Rebuild MedSlime collection UI

on:
  push:
    paths:
      - 'scripts/rebuild_slime_collection_ui.py'
      - '.github/workflows/rebuild_slime_collection_ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild My Slime interface
        run: python scripts/rebuild_slime_collection_ui.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild My Slime collection interface"
          git push
