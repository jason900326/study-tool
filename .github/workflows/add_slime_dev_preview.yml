name: Add slime developer preview

on:
  push:
    paths:
      - 'scripts/add_slime_dev_preview.py'
      - '.github/workflows/add_slime_dev_preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply slime developer preview patch
        run: python scripts/add_slime_dev_preview.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add slime developer preview"
          git push
