name: Apply MedSlime quiz UI patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_medslime_quiz_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/patch_quiz_ui.py

      - name: Syntax check
        run: python -m py_compile streamlit_app.py

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No app changes to commit."
            exit 0
          fi
          git commit -m "Refine quiz progress and finish dialog"
          git push
