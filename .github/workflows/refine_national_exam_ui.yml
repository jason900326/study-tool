name: Refine MedSlime national exam UI

on:
  push:
    paths:
      - 'scripts/refine_national_exam_ui.py'
      - '.github/workflows/refine_national_exam_ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply national exam UI patch
        run: python scripts/refine_national_exam_ui.py

      - name: Syntax check
        run: python -m py_compile streamlit_app.py

      - name: Commit updated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Refine national exam selectors and progress navigation"
          git push
