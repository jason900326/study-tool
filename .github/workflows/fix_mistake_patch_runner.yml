name: Fix mistake bank patch runner

on:
  push:
    paths:
      - 'scripts/fix_mistake_patch_runner.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix patch script
        run: python scripts/fix_mistake_patch_runner.py
      - name: Commit fixed patch script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_mistake_bank.py
          git diff --cached --quiet && exit 0
          git commit -m "Make mistake bank patch target scoped"
          git push
