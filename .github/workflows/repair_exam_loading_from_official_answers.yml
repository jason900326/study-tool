name: Repair exam loading from official answers

on:
  push:
    paths:
      - 'scripts/repair_exam_loading_from_official_answers.py'
      - '.github/workflows/repair_exam_loading_from_official_answers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/repair_exam_loading_from_official_answers.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Repair exam answers from official answer sheets"
          git push
