name: Refine MedSlime progress and exam

on:
  push:
    paths:
      - 'scripts/refine_progress_and_exam.py'
      - '.github/workflows/refine_progress_and_exam.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinements
        run: python scripts/refine_progress_and_exam.py

      - name: Syntax check
        run: python -m py_compile streamlit_app.py

      - name: Commit updated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Refine material upload and quiz progress states"
          git push
