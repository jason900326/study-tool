name: Fix inline nickname focus border
on:
  push:
    paths:
      - 'scripts/fix_inline_name_focus_border.py'
      - '.github/workflows/fix_inline_name_focus_border.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/fix_inline_name_focus_border.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Use simple dark border for inline nickname focus"
          git push
