name: Fix task home and exam score
on:
  push:
    paths:
      - 'scripts/fix_task_home_and_exam_score.py'
      - '.github/workflows/fix_task_home_and_exam_score.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/fix_task_home_and_exam_score.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Anchor checks
        run: |
          grep -q 'score_text = f"{score:.2f}"' streamlit_app.py
          grep -q 'home_claim_daily_' streamlit_app.py
          grep -q 'error_text = str(error).lower()' streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix exam score and home task claims"
          git push
