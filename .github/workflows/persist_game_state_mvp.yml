name: Persist game state MVP
on:
  push:
    paths:
      - 'scripts/persist_game_state_mvp.py'
      - '.github/workflows/persist_game_state_mvp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply game persistence patch
        run: python scripts/persist_game_state_mvp.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Persistence anchors check
        run: |
          grep -q 'def _load_game_state_from_supabase_once' streamlit_app.py
          grep -q '_save_game_state_to_supabase_if_changed()' streamlit_app.py
          grep -q 'player_game_state' streamlit_app.py
          grep -q 'player_slimes' streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Persist MedSlime game state"
          git push
