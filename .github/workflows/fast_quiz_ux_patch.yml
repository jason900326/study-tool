name: Fast quiz UX patch

on:
  push:
    paths:
      - 'scripts/fast_quiz_ux_patch.py'
      - '.github/workflows/fast_quiz_ux_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/fast_quiz_ux_patch.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add quiz score timer and strike options"
          git push
