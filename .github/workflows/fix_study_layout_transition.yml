name: Fix study layout transition

on:
  push:
    paths:
      - 'scripts/fix_study_layout_transition.py'
      - '.github/workflows/fix_study_layout_transition.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply study layout patch
        run: python scripts/fix_study_layout_transition.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix study card alignment and transitions"
          git push
